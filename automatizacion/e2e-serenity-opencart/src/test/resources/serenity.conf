serenity {
  project.name = "Reto QA - E2E compra como invitado en OpenCart"
  take.screenshots = AFTER_EACH_STEP
  restart.browser.for.each = scenario
}

# Para ver el navegador durante la ejecucion: mvn clean verify -Dheadless.mode=false
headless.mode = true

webdriver {
  driver = chrome
  wait.for.timeout = 20000

  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true

    "goog:chromeOptions" {
      args = [
        "--window-size=1920,1080",
        "--no-sandbox",
        "--disable-dev-shm-usage",
        "--disable-gpu",
        "--remote-allow-origins=*",
        "--disable-search-engine-choice-screen",
        "--disable-notifications",
        "--lang=en-US",
        # Chrome 154 (oct-2026) activa por defecto "Always use secure connections".
        # OpenCart mezcla enlaces http y https; se desactiva el upgrade automatico
        # para que la navegacion sea la misma en cualquier version de Chrome.
        "--disable-features=HttpsUpgrades,HttpsFirstBalancedModeAutoEnable"
      ]
    }
  }
}

environments {
  default {
    webdriver.base.url = "http://opencart.abstracta.us/"
  }
  https {
    webdriver.base.url = "https://opencart.abstracta.us/"
  }
}
